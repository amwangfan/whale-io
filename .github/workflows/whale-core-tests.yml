name: whale-core tests
on:
  push:
    paths: ['whale-core/**', '.github/workflows/whale-core-tests.yml']
  pull_request:
    paths: ['whale-core/**', '.github/workflows/whale-core-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e "./whale-core[dev]"
      - run: python -m pytest whale-core/tests -q
      - run: python whale-core/examples/life_scenario.py
