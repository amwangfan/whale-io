[project]
name = "whale-core"
version = "0.1.0"
description = "Whale intelligent layer: intent interfaces over RayNeo / Magic8 infrastructure"
readme = "README.md"
requires-python = ">=3.11"
# Windows 没有系统 IANA 时区库，zoneinfo.ZoneInfo("Asia/Shanghai") 需要 tzdata；
# Linux / macOS 走系统时区库，不会安装此依赖（CI 为 ubuntu，不受影响）。
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whale_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
