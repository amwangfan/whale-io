[project]
name = "whale-core"
version = "0.1.0"
description = "Whale intelligent layer: intent interfaces over RayNeo / Magic8 infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whale_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
